
// Crear tarjetas con metodologia BEM

function crearTarjeta(juego) {

    const guardado = favoritos.includes(juego.id);

    return `
        <article class="card ${guardado ? "card--favorito" : ""}">

            <img
                class="card__imagen"
                src="${juego.imagen}"
                alt="${juego.nombre}"
                loading="lazy"
            >

            <div class="card__contenido">

                <h3 class="card__titulo">
                    ${juego.nombre}
                </h3>

                <p class="card__genero">
                    Plataforma: ${juego.genero}
                </p>

                <p class="card__valoracion">
                    ★ ${juego.valoracion.toFixed(1)} / 5
                </p>

                <p class="card__precio">
                    $${juego.precio} USD
                </p>

                <p class="card__precio-original">
                    $${juego.precioOriginal} USD
                </p>

                <span class="card__descuento">
                    -${juego.descuento}%
                </span>

                <a
                    class="card__oferta"
                    href="${juego.enlace}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Ver oferta
                </a>

                <button
                    type="button"
                    class="card__boton ${guardado ? "card__boton--activo" : ""}"
                    data-id="${juego.id}"
                    aria-pressed="${guardado}"
                >
                    ${guardado ? "♥ Quitar favorito" : "♡ Añadir favorito"}
                </button>

            </div>

        </article>
    `;
}
